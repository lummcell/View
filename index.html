<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0d15;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .orb--1 {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.2), transparent 70%);
        }

        .orb--2 {
            width: 600px;
            height: 600px;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, rgba(120, 50, 255, 0.2), transparent 70%);
            animation-delay: -6s;
        }

        .orb--3 {
            width: 400px;
            height: 400px;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(0, 255, 200, 0.1), transparent 70%);
            animation-delay: -12s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 40px) scale(0.9);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            text-align: center;
        }

        .spinner-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: #4facfe;
            border-right-color: #7c3aed;
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.2);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .title {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0f4ff 0%, #a0c8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            max-width: 420px;
            margin: 0 auto 1.8rem;
        }

        .blink-text {
            display: inline-block;
            animation: blink 2s ease-in-out infinite;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        @media (max-width: 640px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="grid-overlay"></div>

    <main class="card">

        <div class="spinner-wrap">
            <div class="spinner"></div>
        </div>

        <h1 class="title">Server Maintenance</h1>

        <p class="subtitle">
            Sedang dilakukan perbaikan pada sistem. Layanan akan kembali dalam beberapa saat.
        </p>

        <div class="blink-text">● dalam proses</div>

        <div class="footer-note">
            <span>⚡</span>
            <span>🛡️</span>
            <span style="opacity:0.4;">v3.2</span>
        </div>

    </main>

</body>
</html>
